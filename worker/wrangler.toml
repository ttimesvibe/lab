name = "lab"
main = "index.js"
compatibility_date = "2024-01-01"
account_id = "fb0a10864393158e940b149b3ead37f6"  # ttimesvibe (test 환경 — prod 와 분리)

# ⚠️ [placement] 절대 추가 금지!
# wrangler deploy 시 대시보드 Region 설정이 덮어씌워짐
# Region은 Cloudflare 대시보드에서 수동 설정 (GCP US)

[[kv_namespaces]]
binding = "SESSIONS"
id = "fbb8da8adcae4ee0a555abff66f798ac"   # lab-sessions (★ prod editor-session 과 분리 — 데이터 섞임 차단)

# Cron Trigger 명시 영역 비움 — 영구 삭제는 자동화하지 않음 (B 안 정책).
# 관리자가 주기적으로 /projects/trash 확인 후 /projects/trash/purge 로 일괄 처리.
[triggers]
crons = []

# Secrets (wrangler secret put 으로 설정):
# - OPENAI_API_KEY (prod 와 동일 — 사용자 결정 36)
# - GEMINI_API_KEY (prod 와 동일 — 사용자 결정 36)
# - JWT_SECRET (prod 와 같은 값 — 사용자 결정 37, 같은 origin localStorage 공유 호환)
